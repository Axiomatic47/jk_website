# netlify.toml — kirchner.cv (static Next.js export). Build, headers, redirects.
# Netlify builds `main` on push; that push is the production deploy.

[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/works/*"
    [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/uploads/*"
    [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/pdfjs/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonical host: apex. www → apex.
[[redirects]]
  from = "https://www.kirchner.cv/*"
  to = "https://kirchner.cv/:splat"
  status = 301
  force = true

# kirchner.ink forwards to kirchner.cv for now (owner 2026-09-09). To make
# kirchner.ink its own site later: remove these two rules and the domain
# aliases on this Netlify project, then give it its own project.
[[redirects]]
  from = "https://kirchner.ink/*"
  to = "https://kirchner.cv/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kirchner.ink/*"
  to = "https://kirchner.cv/:splat"
  status = 301
  force = true
